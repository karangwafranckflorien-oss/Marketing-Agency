
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISE Marketing Agency | Rwandan Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --electric-blue: #0077FF;
            --brand-orange: #FF7F00; /* Pure Orange from Logo */
            --slate-900: #0f172a;
            --slate-600: #475569;
            --slate-500: #64748b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: var(--slate-900);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        h1, h2, h3, h4, .brand-font {
            font-family: 'Montserrat', sans-serif;
            color: var(--slate-900);
        }
        /* Refined Premium White Glass Effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        /* Smooth Gradient Background */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #ffffff;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 119, 255, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(255, 127, 0, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 119, 255, 0.04) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(255, 127, 0, 0.04) 0px, transparent 50%);
        }
        
        .card-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
            border-color: var(--electric-blue);
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--electric-blue);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.33.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
<body>
    <div class="bg-mesh"></div>
    <div id="root"></div>
    <!-- Crucial: Link to the entry point file -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
